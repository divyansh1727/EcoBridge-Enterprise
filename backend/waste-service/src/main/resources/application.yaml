spring:
  application:
    name: waste-service

  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8888}

security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}