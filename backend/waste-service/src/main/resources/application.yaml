spring:
  application:
    name: waste-service

  config:
    import: optional:configserver:https://ecobridge-enterprise.onrender.com

security:
  jwt:
    secret: ${JWT_SECRET}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}