spring:
  application:
    name: auth-service

  config:
    import: ${SPRING_CONFIG_IMPORT:optional:configserver:http://config-server:8888}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}

management:
  server:
    port: 8081

  endpoints:
    access:
      default: unrestricted

    web:
      exposure:
        include: "*"

  endpoint:
    health:
      access: unrestricted
      show-details: always

    info:
      access: unrestricted

  prometheus:
    metrics:
      export:
        enabled: true