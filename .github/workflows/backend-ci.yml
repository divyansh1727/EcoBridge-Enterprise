name: Backend CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build Spring Boot Services
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - waste-service
          - recycler-service
          - matching-service
          - notification-service
          - analytics-service

    defaults:
      run:
        working-directory: backend/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Give execute permission
        run: chmod +x mvnw

      - name: Build Service
        run: ./mvnw clean package -DskipTests


  docker-build:
    name: Build Docker Images
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - config-server
          - discovery-server
          - api-gateway
          - auth-service
          - waste-service
          - recycler-service
          - matching-service
          - notification-service
          - analytics-service
         
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend/${{ matrix.service }}
          file: ./backend/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: ecobridge/${{ matrix.service }}:ci