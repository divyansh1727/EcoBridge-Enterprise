apiVersion: apps/v1
kind: Deployment

metadata:
  name: api-gateway
  namespace: ecobridge

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          image: ecobridge/api-gateway:1.0

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: ecobridge-config

            - secretRef:
                name: ecobridge-secret

          env:
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://config-server:8888"

            - name: EUREKA_SERVER_URL
              value: "http://discovery-server:8761/eureka/"